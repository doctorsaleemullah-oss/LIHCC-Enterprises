<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="color-scheme" content="light">

<title>LIHCC Enterprises — Inventory, Sales & Accounting</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<style>
:root{--blue:#1d4ed8;--blue2:#1e3a8a;--green:#059669;--red:#dc2626;--amber:#d97706;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit}
a{color:var(--blue);text-decoration:none}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:18px 16px;border-bottom:1px solid #1e293b}
.brand .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#93c5fd;font-weight:700}
.brand h1{font-size:15px;color:#fff;margin-top:4px;line-height:1.3}
.nav{flex:1;overflow:auto;padding:10px 8px}
.nav a,.nav button.navbtn{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;color:#cbd5e1;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;text-align:left}
.nav a:hover,.nav button.navbtn:hover,.nav a.on{background:#1e293b;color:#fff}
.side-foot{padding:14px;border-top:1px solid #1e293b;font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:20}
.top input.search{flex:1;max-width:520px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.content{padding:20px;flex:1}
h2.page{font-size:24px;font-weight:800}
.sub{color:var(--muted);font-size:13px;margin:4px 0 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:#fff;border:1px solid #eef2f7;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.04)}
.kpi{padding:16px 18px}
.kpi .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;margin-top:6px}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer}
.btn-p{background:var(--blue);color:#fff}
.btn-g{background:var(--green);color:#fff}
.btn-x{background:#e2e8f0;color:#0f172a}
.btn-d{background:#fef2f2;color:var(--red)}
.btn:disabled{opacity:.5}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
.label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.badge{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800;text-transform:uppercase}
.b-g{background:#ecfdf5;color:#047857}.b-r{background:#fef2f2;color:#b91c1c}.b-a{background:#fffbeb;color:#b45309}.b-b{background:#eff6ff;color:#1d4ed8}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(135deg,#1e3a8a,#1d4ed8,#047857);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.box{display:grid;place-items:center;padding:24px}
.box .card{width:100%;max-width:400px;padding:28px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:99;display:none}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}
.item-row{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#f8fafc}
.mobile-nav{display:none;overflow:auto;white-space:nowrap;padding:8px;background:#fff;border-bottom:1px solid var(--line)}
.profit{color:var(--green);font-weight:800}.loss{color:var(--red);font-weight:800}
.bill{padding:0;overflow:hidden}
.bill-h{background:#1e3a8a;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;gap:12px}
.muted{color:var(--muted);font-size:12px}
.empty{padding:36px;text-align:center;color:var(--muted)}
.install-bar{position:fixed;right:16px;bottom:72px;z-index:90;display:none;align-items:center;gap:10px;background:#0f172a;color:#fff;padding:12px 14px;border-radius:16px;box-shadow:0 16px 40px rgba(15,23,42,.28);max-width:min(360px,calc(100vw - 32px))}
.install-bar.show{display:flex}
.offline-bar{display:none;background:#fef3c7;color:#92400e;text-align:center;padding:8px 12px;font-size:13px;font-weight:700}
.offline-bar.show{display:block}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media(display-mode:standalone){.install-bar{display:none!important}}
@media(max-width:900px){.sidebar{display:none}.login{grid-template-columns:1fr}.hero{display:none}.mobile-nav{display:block}}
@media print{.no-print{display:none!important}body{background:#fff}.sidebar,.top,.mobile-nav,.install-bar,.offline-bar{display:none!important}.content{padding:0}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<div id="offline-bar" class="offline-bar no-print">You are offline. Records already on this device still work.</div>
<div id="app"></div>
<div id="install-bar" class="install-bar no-print">
  <div style="flex:1;font-size:13px;line-height:1.35"><b>Install LIHCC Enterprises</b><div style="opacity:.8;font-weight:600">Add to this phone or computer. Works offline after install.</div></div>
  <button class="btn btn-p" onclick="installPWA()">Install</button>
  <button class="btn btn-x" onclick="dismissInstall()">Later</button>
</div>
<div id="toast" class="toast"></div>
<script>
"use strict";
const KEY="LIHCC_HTML_V1";
const MODULES=["dashboard","products","purchases","sales","consignments","customers","vendors","payments","expenses","accounting","reports","users","settings"];
const LABELS={dashboard:"Dashboard",products:"Products / Inventory",purchases:"Purchases",sales:"Sales / Invoices",consignments:"Consignments",customers:"Customers",vendors:"Vendors",payments:"Payments",expenses:"Expenses",accounting:"Accounting / Ledgers",reports:"Reports",users:"Users & Permissions",settings:"Settings"};
const RANK={none:0,view:1,create:2,edit:3,void:4,admin:5};
const AC={CASH:"1000",BANK:"1010",AR:"1100",INV:"1200",INV_C:"1210",AP:"2000",TAX:"2100",EQ:"3000",SALES:"4000",COGS:"5000",EXP:"6000"};

let S, session, screen="dashboard", pid="", q="";
let deferredPrompt=null;

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const uid = (p)=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const round2 = n=>Math.round((Number(n)||0)*100)/100;
const money = n=>{const v=Number(n)||0;return (v<0?"−":"")+(S.company.currencySymbol||"Rs")+" "+Math.abs(v).toLocaleString("en-PK",{minimumFractionDigits:2,maximumFractionDigits:2});};
const fmt = d=>{if(!d)return "—";const dt=new Date(d);if(isNaN(dt))return "—";return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});};
const today = ()=>new Date().toISOString().slice(0,10);
const iso = (y,m,d)=>new Date(y,m-1,d,12).toISOString();
function toast(msg,t="ok"){const el=$("toast");el.textContent=msg;el.className="toast "+t;el.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display="none",2800);}
function can(mod,need="view"){if(!session)return false;const have=session.perms[mod]||"none";return RANK[have]>=RANK[need];}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);return true;}}catch(e){}return false;}
function nextNo(key,prefix){S.seq[key]=(S.seq[key]||0)+1;return prefix+"-"+String(S.seq[key]).padStart(5,"0");}
function audit(action,type,label,prev,next){S.audit.unshift({id:uid("AU"),at:new Date().toISOString(),user:session?session.username:"system",action,type,label,prev:prev||"",next:next||""});S.audit=S.audit.slice(0,800);}

function defaultPerms(role){
  const all=Object.fromEntries(MODULES.map(m=>[m,"admin"]));
  if(role==="Super Administrator") return all;
  if(role==="Accountant") return {dashboard:"view",products:"view",purchases:"void",sales:"void",consignments:"edit",customers:"edit",vendors:"edit",payments:"void",expenses:"void",accounting:"admin",reports:"admin",users:"none",settings:"view"};
  if(role==="Inventory Manager") return {dashboard:"view",products:"admin",purchases:"edit",sales:"view",consignments:"admin",customers:"view",vendors:"view",payments:"none",expenses:"none",accounting:"none",reports:"view",users:"none",settings:"none"};
  if(role==="Sales User") return {dashboard:"view",products:"view",purchases:"none",sales:"edit",consignments:"view",customers:"edit",vendors:"none",payments:"create",expenses:"none",accounting:"none",reports:"view",users:"none",settings:"none"};
  return Object.fromEntries(MODULES.map(m=>[m,m==="users"||m==="settings"?"none":"view"]));
}

function emptyState(){
  return {
    company:{name:"LIHCC Enterprises",legalName:"LIHCC Enterprises",address:"Adjacent to Luqman Cardiac Center",phone:"",whatsapp:"",email:"",ntn:"",bankName:"",bankTitle:"",bankNo:"",iban:"",footer:"Thank you for your business. Goods remain the property of LIHCC Enterprises until fully paid.",terms:"1. Payment is due as per agreed terms.\n2. Quote the invoice number on payments.\n3. Shortage/damage claims within 48 hours.\n4. Consigned items remain our property until billed.",authName:"Authorized Signatory",authTitle:"Proprietor",logo:"",sign:"",stamp:"",template:"classic",costing:"FIFO",currencySymbol:"Rs",invPrefix:"INV",purPrefix:"PUR",conPrefix:"CON"},
    users:[], roles:[], vendors:[], customers:[], categories:[], products:[], lots:[], movements:[],
    purchases:[], sales:[], consignments:[], payments:[], expenses:[], journals:[], accounts:[],
    banks:[], audit:[], seq:{purchase:0,sale:0,consignment:0,payment:0,expense:0,journal:0,product:0,customer:0,vendor:0}
  };
}

function postJournal(date,memo,source,sourceId,lines){
  const cleaned=lines.map(l=>({...l,debit:round2(l.debit||0),credit:round2(l.credit||0)})).filter(l=>l.debit||l.credit);
  const dr=round2(cleaned.reduce((s,l)=>s+l.debit,0)), cr=round2(cleaned.reduce((s,l)=>s+l.credit,0));
  if(Math.abs(dr-cr)>0.05) throw new Error("Unbalanced journal "+dr+" / "+cr);
  S.journals.push({id:uid("JV"),number:nextNo("journal","JV"),date,entered:new Date().toISOString(),memo,source,sourceId,voided:false,lines:cleaned});
}

function accBal(code){
  let d=0,c=0;
  S.journals.filter(j=>!j.voided).forEach(j=>j.lines.filter(l=>l.code===code).forEach(l=>{d+=l.debit;c+=l.credit;}));
  const acc=S.accounts.find(a=>a.code===code);
  const type=acc?acc.type:"ASSET";
  return (type==="ASSET"||type==="EXPENSE")?round2(d-c):round2(c-d);
}

function lotsAt(productId,loc){
  return S.lots.filter(l=>l.productId===productId && l.location===loc && l.qtyRemaining>0.0001)
    .sort((a,b)=>String(a.received).localeCompare(String(b.received)));
}
function allocate(productId,qty,loc){
  const lots=lotsAt(productId,loc||"ON_HAND");
  const avail=lots.reduce((s,l)=>s+l.qtyRemaining,0);
  if(avail+1e-9<qty) throw new Error("Insufficient stock. Need "+qty+", available "+round2(avail));
  const avg=lots.reduce((s,l)=>s+l.qtyRemaining*l.unitCost,0)/(avail||1);
  const method=S.company.costing||"FIFO";
  const layers=[]; let rem=qty;
  for(const lot of lots){
    if(rem<=0) break;
    const take=Math.min(lot.qtyRemaining,rem);
    const unit=method==="WEIGHTED_AVERAGE"?round2(avg):lot.unitCost;
    layers.push({lotId:lot.id,qty:take,unitCost:unit,amount:round2(take*unit),batch:lot.batch});
    rem=round2(rem-take);
  }
  return layers;
}
function consume(layers,productId,date,type,ref,newLoc){
  layers.forEach(ly=>{
    const lot=S.lots.find(l=>l.id===ly.lotId); if(!lot) return;
    lot.qtyRemaining=round2(lot.qtyRemaining-ly.qty);
    if(newLoc){
      S.lots.push({id:uid("LT"),productId,sourceType:type,sourceId:ref,received:date,qtyReceived:ly.qty,qtyRemaining:ly.qty,unitCost:ly.unitCost,batch:lot.batch||"",location:newLoc});
    }
    S.movements.unshift({id:uid("MV"),productId,lotId:ly.lotId,type,qty:newLoc? -ly.qty : -ly.qty,unitCost:ly.unitCost,date,entered:new Date().toISOString(),ref,notes:type});
  });
  refreshAvg(productId);
}
function restore(layers,productId,date,type,ref){
  layers.forEach(ly=>{
    const lot=S.lots.find(l=>l.id===ly.lotId);
    if(lot) lot.qtyRemaining=round2(lot.qtyRemaining+ly.qty);
    else S.lots.push({id:ly.lotId||uid("LT"),productId,sourceType:type,sourceId:ref,received:date,qtyReceived:ly.qty,qtyRemaining:ly.qty,unitCost:ly.unitCost,batch:"",location:"ON_HAND"});
    S.movements.unshift({id:uid("MV"),productId,type,qty:ly.qty,unitCost:ly.unitCost,date,entered:new Date().toISOString(),ref,notes:"Void / reversal"});
  });
  refreshAvg(productId);
}
function createLot(p){
  const lot={id:uid("LT"),productId:p.productId,sourceType:p.sourceType,sourceId:p.sourceId,received:p.date,qtyReceived:p.qty,qtyRemaining:p.qty,unitCost:p.unitCost,batch:p.batch||"",location:p.location||"ON_HAND"};
  S.lots.push(lot);
  S.movements.unshift({id:uid("MV"),productId:p.productId,lotId:lot.id,type:p.sourceType,qty:p.qty,unitCost:p.unitCost,date:p.date,entered:new Date().toISOString(),ref:p.sourceId,notes:p.notes||""});
  const prod=S.products.find(x=>x.id===p.productId);
  if(prod && p.sourceType==="PURCHASE"){prod.lastPurchasePrice=p.unitCost;prod.purchasePrice=p.unitCost;}
  refreshAvg(p.productId);
  return lot;
}
function refreshAvg(productId){
  const lots=S.lots.filter(l=>l.productId===productId && l.qtyRemaining>0);
  const qty=lots.reduce((s,l)=>s+l.qtyRemaining,0), val=lots.reduce((s,l)=>s+l.qtyRemaining*l.unitCost,0);
  const p=S.products.find(x=>x.id===productId); if(p) p.averageCost=qty?round2(val/qty):0;
}
function stock(productId){
  const lots=S.lots.filter(l=>l.productId===productId);
  return {
    onHand:round2(lots.filter(l=>l.location==="ON_HAND").reduce((s,l)=>s+l.qtyRemaining,0)),
    consigned:round2(lots.filter(l=>l.location==="CONSIGNED").reduce((s,l)=>s+l.qtyRemaining,0)),
    value:round2(lots.reduce((s,l)=>s+l.qtyRemaining*l.unitCost,0))
  };
}
function custOut(id){
  const c=S.customers.find(x=>x.id===id); if(!c) return 0;
  const sales=S.sales.filter(s=>s.customerId===id && s.status==="POSTED");
  return round2((c.opening||0)+sales.reduce((s,x)=>s+x.total-x.paid,0));
}
function vendOut(id){
  const v=S.vendors.find(x=>x.id===id); if(!v) return 0;
  const p=S.purchases.filter(x=>x.vendorId===id && x.status==="POSTED");
  return round2((v.opening||0)+p.reduce((s,x)=>s+x.total-x.paid,0));
}

function seed(){
  S=emptyState();
  S.accounts=[
    {code:AC.CASH,name:"Cash on Hand",type:"ASSET"},{code:AC.BANK,name:"Bank Accounts",type:"ASSET"},
    {code:AC.AR,name:"Accounts Receivable",type:"ASSET"},{code:AC.INV,name:"Inventory — On Hand",type:"ASSET"},
    {code:AC.INV_C,name:"Inventory — Consigned",type:"ASSET"},{code:AC.AP,name:"Accounts Payable",type:"LIABILITY"},
    {code:AC.TAX,name:"Tax Payable",type:"LIABILITY"},{code:AC.EQ,name:"Opening Balance Equity",type:"EQUITY"},
    {code:AC.SALES,name:"Sales Revenue",type:"REVENUE"},{code:AC.COGS,name:"Cost of Goods Sold",type:"EXPENSE"},
    {code:AC.EXP,name:"Operating Expenses",type:"EXPENSE"}
  ];
  S.banks=[{id:"cash",name:"Cash in Hand",isCash:true},{id:"bank",name:"Business Bank Account",isCash:false}];
  ["Super Administrator","Accountant","Inventory Manager","Sales User","Viewer"].forEach(n=>S.roles.push({id:uid("RL"),name:n,perms:defaultPerms(n)}));
  const r=n=>S.roles.find(x=>x.name===n).id;
  S.users=[
    {id:"u1",username:"admin",password:"Admin@123",name:"System Administrator",roleId:r("Super Administrator"),active:true},
    {id:"u2",username:"accountant",password:"Accounts@123",name:"Accounts Officer",roleId:r("Accountant"),active:true},
    {id:"u3",username:"inventory",password:"Stock@123",name:"Inventory Manager",roleId:r("Inventory Manager"),active:true},
    {id:"u4",username:"sales",password:"Sales@123",name:"Sales User",roleId:r("Sales User"),active:true},
    {id:"u5",username:"viewer",password:"Viewer@123",name:"Read Only",roleId:r("Viewer"),active:true}
  ];
  ["Coronary stents","Balloons","PTCA wires","Catheters","Sheaths","Guidewires","Medical consumables","Other medical equipment/items"].forEach(n=>S.categories.push({id:uid("CAT"),name:n}));
  const cat=n=>S.categories.find(c=>c.name===n).id;
  const addP=(code,name,catn,brand,catNo,cost,sell,min)=>{
    const p={id:uid("PR"),code,name,generic:"",categoryId:cat(catn),brand,catalogue:catNo,unit:"Piece",minStock:min,purchasePrice:cost,sellingPrice:sell,lastPurchasePrice:cost,averageCost:cost,tax:0,active:true,notes:""};
    S.products.push(p); return p;
  };
  const stent=addP("ITM-0001","Drug Eluting Coronary Stent 2.75 x 18 mm","Coronary stents","CardioStent","DES-275-18",52000,62000,2);
  const stent2=addP("ITM-0002","Drug Eluting Coronary Stent 3.0 x 23 mm","Coronary stents","CardioStent","DES-300-23",54000,65000,2);
  const balloon=addP("ITM-0003","PTCA Balloon 2.5 x 15 mm","Balloons","FlexBalloon","BAL-250-15",12000,16000,4);
  const wire=addP("ITM-0004","PTCA Guidewire 0.014\" 180 cm","PTCA wires","WirePro","WIR-014-180",4500,6500,10);
  addP("ITM-0005","Judkins Right Catheter 6F","Catheters","CathLine","JR-6F",1800,2800,8);
  const sheath=addP("ITM-0006","Introducer Sheath 6F 11 cm","Sheaths","AccessMed","SH-6F-11",900,1500,12);
  addP("ITM-0007","Hydrophilic Guidewire 0.035\" 150 cm","Guidewires","GlidePath","GW-035-150",2200,3200,6);
  addP("ITM-0008","Contrast Syringe 10 ml (sterile)","Medical consumables","MediCons","SYR-10",80,140,50);

  S.customers.push({id:"c1",code:"CUS-0001",name:"Luqman Cardiac Center",org:"Luqman Cardiac Center (LIHCC)",phone:"",email:"",address:"",ntn:"",terms:"Monthly settlement",opening:0,notes:"Dedicated institutional account.",active:true,lihcc:true});
  S.customers.push({id:"c2",code:"CUS-0002",name:"City Heart Clinic",org:"City Heart Clinic",phone:"",email:"",address:"",opening:0,active:true,lihcc:false,terms:"Net 30"});
  S.customers.push({id:"c3",code:"CUS-0003",name:"Regional Medical Center",org:"Regional Medical Center",phone:"",opening:0,active:true,lihcc:false,terms:"Net 15"});
  S.vendors.push({id:"v1",code:"VEN-0001",name:"MediSupply International",company:"MediSupply International",phone:"",opening:0,active:true,terms:"Cash / Credit"});
  S.vendors.push({id:"v2",code:"VEN-0002",name:"CardioTech Distributors",company:"CardioTech Distributors",phone:"",opening:0,active:true,terms:"Cash"});

  const admin={id:"u1",username:"admin",perms:defaultPerms("Super Administrator")};
  session=admin;
  function buy(date,vendorId,items,paid,method){
    const built=items.map(it=>{
      const line=round2(it.qty*it.price);
      return {...it,lineTotal:line,discount:0,tax:0};
    });
    const total=round2(built.reduce((s,i)=>s+i.lineTotal,0));
    const rec={id:uid("PU"),number:nextNo("purchase","PUR"),vendorId,date,entered:new Date().toISOString(),method,paid,total,subtotal:total,status:"POSTED",items:built,notes:"",ref:""};
    S.purchases.push(rec);
    built.forEach(it=>createLot({productId:it.productId,sourceType:"PURCHASE",sourceId:rec.id,date,qty:it.qty,unitCost:it.price,batch:it.batch}));
    const lines=[{code:AC.INV,debit:total}];
    if(paid>0) lines.push({code:AC.CASH,credit:paid});
    if(total-paid>0) lines.push({code:AC.AP,credit:round2(total-paid),party:"VENDOR",partyId:vendorId});

function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
}
function pwaReady(){
  return location.protocol!=="file:" && "serviceWorker" in navigator;
}
function dismissInstall(){
  const bar=$("install-bar"); if(bar) bar.classList.remove("show");
  try{sessionStorage.setItem("LIHCC_INSTALL_LATER","1");}catch(e){}
}
async function installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    const choice=await deferredPrompt.userChoice;
    deferredPrompt=null;
    dismissInstall();
    toast(choice.outcome==="accepted"?"Installed on this device":"Install cancelled",choice.outcome==="accepted"?"ok":"err");
    return;
  }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  toast(ios?"On iPhone/iPad: tap Share, then Add to Home Screen":"Use the install icon in the browser address bar, or Chrome menu → Install app.","err");
}
function showInstallBar(){
  const bar=$("install-bar");
  if(!bar||isStandalone()||!deferredPrompt) return;
  try{if(sessionStorage.getItem("LIHCC_INSTALL_LATER")) return;}catch(e){}
  bar.classList.add("show");
}
function registerPWA(){
  const offline=$("offline-bar");
  const syncOffline=()=>{if(offline) offline.classList.toggle("show", !navigator.onLine);};
  syncOffline();
  window.addEventListener("online",syncOffline);
  window.addEventListener("offline",syncOffline);
  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault();
    deferredPrompt=e;
    showInstallBar();
  });
  window.addEventListener("appinstalled",()=>{
    deferredPrompt=null;
    dismissInstall();
    toast("LIHCC Enterprises is installed");
  });
  if(!pwaReady()) return;
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

function collectItems(mode){
  const rows=[...document.querySelectorAll(".item-row")];
  return rows.map(r=>{
    const productId=r.querySelector("[data-k=productId]").value;
    const qty=+r.querySelector("[data-k=qty]").value||0;
    const price=+r.querySelector("[data-k=price]").value||0;
    const discount=+(r.querySelector("[data-k=disc]")||{value:0}).value||0;
    const tax=+(r.querySelector("[data-k=tax]")||{value:0}).value||0;
    const batch=(r.querySelector("[data-k=batch]")||{value:""}).value;
    const serial=(r.querySelector("[data-k=serial]")||{value:""}).value;
    const expiry=(r.querySelector("[data-k=expiry]")||{value:""}).value;
    return {productId,qty,price,discount,tax,batch,serial,expiry};
  }).filter(x=>x.productId && x.qty>0);
}

function savePurchase(){
  if(!can("purchases","create")) return toast("No permission","err");
  const vendorId=$("f-party").value, date=$("f-date").value||today(), method=$("f-method").value, paid=+$("f-paid").value||0, notes=$("f-notes").value, ref=$("f-ref").value;
  const items=collectItems("purchase");
  if(!vendorId) return toast("Select a vendor","err");
  if(!items.length) return toast("Add items","err");
  const built=items.map(it=>{
    const taxable=round2(it.qty*it.price-it.discount);
    const taxAmt=round2(taxable*(it.tax/100));
    return {...it,unitPrice:it.price,taxAmt,lineTotal:round2(taxable+taxAmt)};
  });
  const total=round2(built.reduce((s,i)=>s+i.lineTotal,0));
  const rec={id:uid("PU"),number:nextNo("purchase",S.company.purPrefix||"PUR"),vendorId,date,entered:new Date().toISOString(),method,paid:Math.min(paid|| (method==="credit"?0:total), total),total,subtotal:round2(built.reduce((s,i)=>s+i.qty*i.price,0)),status:"POSTED",items:built,notes,ref};
  try{
    built.forEach(it=>createLot({productId:it.productId,sourceType:"PURCHASE",sourceId:rec.id,date,qty:it.qty,unitCost:round2(it.lineTotal/it.qty),batch:it.batch}));
    const lines=[{code:AC.INV,debit:rec.total}];
    if(rec.paid>0) lines.push({code:method==="cash"?AC.CASH:AC.BANK,credit:rec.paid});
    if(rec.total-rec.paid>0) lines.push({code:AC.AP,credit:round2(rec.total-rec.paid),party:"VENDOR",partyId:vendorId});
    postJournal(date,"Purchase "+rec.number,"PURCHASE",rec.id,lines);
    S.purchases.unshift(rec);
    audit("CREATE","Purchase",rec.number);
    save(); toast("Purchase "+rec.number+" posted"); go("purchase",rec.id);
  }catch(e){toast(e.message,"err");}
}

function saveSale(){
  if(!can("sales","create")) return toast("No permission","err");
  const customerId=$("f-party").value, date=$("f-date").value||today(), method=$("f-method").value, paid=+$("f-paid").value||0, notes=$("f-notes").value, ref=$("f-ref").value;
  const items=collectItems("sale");
  if(!customerId) return toast("Select a customer","err");
  if(!items.length) return toast("Add items","err");
  try{
    const built=items.map(it=>{
      const layers=allocate(it.productId,it.qty,"ON_HAND");
      const cost=round2(layers.reduce((s,l)=>s+l.amount,0));
      const taxable=round2(it.qty*it.price-it.discount);
      const taxAmt=round2(taxable*(it.tax/100));
      const line=round2(taxable+taxAmt);
      return {...it,sellingPrice:it.price,taxAmt,lineTotal:line,cost,profit:round2(taxable-cost),layers};
    });
    const total=round2(built.reduce((s,i)=>s+i.lineTotal,0));
    const cost=round2(built.reduce((s,i)=>s+i.cost,0));
    const pay=Math.min(paid||(method==="credit"?0:total),total);
    const rec={id:uid("SA"),number:nextNo("sale",S.company.invPrefix||"INV"),customerId,date,entered:new Date().toISOString(),method,paid:pay,total,subtotal:round2(built.reduce((s,i)=>s+i.qty*i.price,0)),totalCost:cost,profit:round2(built.reduce((s,i)=>s+i.profit,0)),status:"POSTED",payStatus:pay<=0?"UNPAID":pay+0.01>=total?"PAID":"PARTIAL",items:built,token:uid("TK"),notes,ref,sent:false,viewed:false};
    built.forEach(it=>consume(it.layers,it.productId,date,"SALE",rec.id));
    const lines=[];
    if(pay>0) lines.push({code:method==="cash"?AC.CASH:AC.BANK,debit:pay});
    if(total-pay>0) lines.push({code:AC.AR,debit:round2(total-pay),party:"CUSTOMER",partyId:customerId});
    const taxTotal=round2(built.reduce((s,i)=>s+(i.taxAmt||0),0));
    const netSales=round2(total-taxTotal);
    lines.push({code:AC.SALES,credit:netSales});
    if(taxTotal>0) lines.push({code:AC.TAX,credit:taxTotal});
    if(cost>0){lines.push({code:AC.COGS,debit:cost});lines.push({code:AC.INV,credit:cost});}
    postJournal(date,"Sale "+rec.number,"SALE",rec.id,lines);
    S.sales.unshift(rec);
    audit("CREATE","Sale",rec.number,null,{total,cost,profit:rec.profit,date});
    save(); toast("Invoice "+rec.number+" saved"); go("sale",rec.id);
  }catch(e){toast(e.message,"err");}
}

function updateConsigItem(cid,iid){
  const c=S.consignments.find(x=>x.id===cid); const it=c.items.find(x=>x.id===iid);
  const used=+$("u-"+iid).value||0, ret=+$("r-"+iid).value||0;
  if(used+ret>it.qtySupplied+1e-6) return toast("Used + returned cannot exceed supplied","err");
  const extraR=round2(ret-it.qtyReturned);
  try{
    if(extraR>0){
      const layers=allocate(it.productId,extraR,"CONSIGNED");
      consume(layers,it.productId,today(),"CONSIGNMENT_RETURN",c.id,"ON_HAND");
      postJournal(today(),"Return "+c.number,"CONSIGNMENT_RETURN",c.id,[{code:AC.INV,debit:round2(extraR*it.costPrice)},{code:AC.INV_C,credit:round2(extraR*it.costPrice)}]);
    }
    it.qtyUsed=used; it.qtyReturned=ret;
    const rem=it.qtySupplied-used-ret;
    it.status=rem<=0 && ret>=it.qtySupplied?"RETURNED":(used||ret)?"PARTIALLY_SETTLED":"IN_STOCK_AT_CUSTOMER";
    c.status=c.items.every(i=>i.status==="SETTLED"||i.status==="RETURNED")?"SETTLED":"PARTIALLY_SETTLED";
    audit("EDIT","Consignment",c.number,{used:it.qtyUsed,ret:it.qtyReturned},{used,ret});
    save(); toast("Updated"); go("consignment",cid);
  }catch(e){toast(e.message,"err");}
}

function billConsignment(cid){
  const c=S.consignments.find(x=>x.id===cid);
  const date=$("bill-date").value||today();
  try{
    const items=[];
    c.items.forEach(it=>{
      const q=round2(it.qtyUsed-it.qtyBilled); if(q<=0) return;
      const p=S.products.find(x=>x.id===it.productId);
      items.push({productId:it.productId,qty:q,price:it.expected||p.sellingPrice,discount:0,tax:p.tax||0});
      it.qtyBilled=round2(it.qtyBilled+q);
    });
    if(!items.length) return toast("Nothing billable — mark used first","err");
    const built=items.map(it=>{
      const layers=allocate(it.productId,it.qty,"CONSIGNED");
      const cost=round2(layers.reduce((s,l)=>s+l.amount,0));
      const line=round2(it.qty*it.price);
      return {...it,sellingPrice:it.price,lineTotal:line,cost,profit:round2(line-cost),layers,taxAmt:0};
    });
    const total=round2(built.reduce((s,i)=>s+i.lineTotal,0));
    const cost=round2(built.reduce((s,i)=>s+i.cost,0));
    const rec={id:uid("SA"),number:nextNo("sale",S.company.invPrefix||"INV"),customerId:c.customerId,date,entered:new Date().toISOString(),method:"credit",paid:0,total,subtotal:total,totalCost:cost,profit:round2(total-cost),status:"POSTED",payStatus:"UNPAID",items:built,token:uid("TK"),notes:"Billed from "+c.number,ref:c.number,consignmentId:c.id};
    built.forEach(it=>consume(it.layers,it.productId,date,"SALE",rec.id));
    postJournal(date,"Sale "+rec.number+" from "+c.number,"SALE",rec.id,[
      {code:AC.AR,debit:total,party:"CUSTOMER",partyId:c.customerId},{code:AC.SALES,credit:total},
      {code:AC.COGS,debit:cost},{code:AC.INV_C,credit:cost}

  }catch(e){toast(e.message,"err");}
}

function savePayment(){
  if(!can("payments","create")) return toast("No permission","err");
  const dir=$("f-dir").value, ptype=$("f-ptype").value, amount=+$("f-amt").value||0, date=$("f-date").value||today(), method=$("f-method").value, notes=$("f-notes").value, ref=$("f-ref").value;
  const customerId=$("f-cust").value||"", vendorId=$("f-vend").value||"";
  if(amount<=0) return toast("Enter amount","err");
  if(ptype==="CUSTOMER"&&!customerId) return toast("Select customer","err");
  if(ptype==="VENDOR"&&!vendorId) return toast("Select vendor","err");
  let left=amount; const allocs=[];
  if(dir==="IN"&&customerId){
    S.sales.filter(s=>s.customerId===customerId && s.status==="POSTED" && s.payStatus!=="PAID").sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
      if(left<=0) return; const due=round2(s.total-s.paid); const a=Math.min(due,left); if(a<=0)return;
      s.paid=round2(s.paid+a); s.payStatus=s.paid+0.01>=s.total?"PAID":"PARTIAL"; allocs.push({saleId:s.id,amount:a}); left=round2(left-a);
    });
  }
  if(dir==="OUT"&&vendorId){
    S.purchases.filter(p=>p.vendorId===vendorId && p.status==="POSTED").sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{
      if(left<=0) return; const due=round2(p.total-p.paid); if(due<=0)return; const a=Math.min(due,left);
      p.paid=round2(p.paid+a); allocs.push({purchaseId:p.id,amount:a}); left=round2(left-a);
    });
  }
  const rec={id:uid("PY"),number:nextNo("payment","PAY"),dir,ptype,customerId,vendorId,date,entered:new Date().toISOString(),method,amount,unallocated:left,notes,ref,status:"POSTED",allocs};
  const cash=method==="cash"?AC.CASH:AC.BANK;
  const lines=dir==="IN"?[{code:cash,debit:amount},{code:AC.AR,credit:amount,party:"CUSTOMER",partyId:customerId}]:[{code:AC.AP,debit:amount,party:"VENDOR",partyId:vendorId},{code:cash,credit:amount}];
  postJournal(date,"Payment "+rec.number,"PAYMENT",rec.id,lines);
  S.payments.unshift(rec); audit("CREATE","Payment",rec.number); save(); toast("Payment saved"); go("payments");
}

  if(pid){const i=S.products.findIndex(x=>x.id===pid); const prev=S.products[i]; S.products[i]={...prev,...rec,averageCost:prev.averageCost,lastPurchasePrice:prev.lastPurchasePrice}; audit("EDIT","Product",name);}
  else {
    S.products.push(rec);
    if(open>0){createLot({productId:rec.id,sourceType:"OPENING",sourceId:rec.id,date:$("f-odate").value||today(),qty:open,unitCost:oc}); postJournal($("f-odate").value||today(),"Opening stock "+name,"OPENING",rec.id,[{code:AC.INV,debit:round2(open*oc)},{code:AC.EQ,credit:round2(open*oc)}]);}
    audit("CREATE","Product",name);
  }
  save(); toast("Product saved"); go("products");
}

function adjustStock(id){
  const qty=+$("adj-qty").value||0, cost=+$("adj-cost").value||0, reason=$("adj-reason").value, date=$("adj-date").value||today(), notes=$("adj-notes").value;
  if(!qty) return toast("Enter qty","err");
  try{
    if(qty>0) createLot({productId:id,sourceType:"ADJUSTMENT",sourceId:"ADJ",date,qty,unitCost:cost,notes:reason});
    else {const layers=allocate(id,Math.abs(qty),"ON_HAND"); consume(layers,id,date,reason==="DAMAGED"||reason==="EXPIRED"?reason:"ADJUSTMENT","ADJ");}
    audit("ADJUST","Stock",id,null,{qty,reason}); save(); toast("Adjustment posted"); go("product",id);
  }catch(e){toast(e.message,"err");}
}

function voidSale(id){
  if(!can("sales","void")) return toast("No permission","err");
  const s=S.sales.find(x=>x.id===id); if(!s||s.status==="VOIDED") return;
  s.items.forEach(it=>restore(it.layers||[],it.productId,today(),"SALE_VOID",s.id));
  s.status="VOIDED";
  S.journals.filter(j=>j.sourceId===id && !j.voided).forEach(j=>{
    j.voided=true;
    postJournal(today(),"Void "+j.number,"SALE",id,j.lines.map(l=>({code:l.code,debit:l.credit,credit:l.debit})));
  });
  audit("VOID","Sale",s.number); save(); toast("Invoice voided"); go("sale",id);
}
function voidPurchase(id){
  if(!can("purchases","void")) return toast("No permission","err");
  const p=S.purchases.find(x=>x.id===id); if(!p||p.status==="VOIDED") return;
  const lots=S.lots.filter(l=>l.sourceType==="PURCHASE"&&l.sourceId===id);
  if(lots.some(l=>l.qtyRemaining+0.0001<l.qtyReceived)) return toast("Cannot void — stock already sold/consigned. Use a return.","err");
  lots.forEach(l=>{l.qtyRemaining=0; S.movements.unshift({id:uid("MV"),productId:l.productId,type:"PURCHASE_RETURN",qty:-l.qtyReceived,unitCost:l.unitCost,date:today(),entered:new Date().toISOString(),ref:id,notes:"Void "+p.number});});
  p.status="VOIDED";
  S.journals.filter(j=>j.sourceId===id && !j.voided).forEach(j=>{j.voided=true; postJournal(today(),"Void "+j.number,"PURCHASE",id,j.lines.map(l=>({code:l.code,debit:l.credit,credit:l.debit})));});
  audit("VOID","Purchase",p.number); save(); toast("Purchase voided"); go("purchase",id);
}

function exportCsv(type){
  let headers, rows;
  if(type==="sales"){headers=["Date","Entered","Invoice","Customer","Total","Cost","Profit","Paid","Status"];rows=S.sales.filter(s=>s.status==="POSTED").map(s=>{const c=S.customers.find(x=>x.id===s.customerId);return [fmt(s.date),fmt(s.entered),s.number,c?c.name:"",s.total,s.totalCost,s.profit,s.paid,s.payStatus];});}
  else if(type==="purchases"){headers=["Date","Bill","Vendor","Total","Paid"];rows=S.purchases.filter(p=>p.status==="POSTED").map(p=>{const v=S.vendors.find(x=>x.id===p.vendorId);return [fmt(p.date),p.number,v?v.name:"",p.total,p.paid];});}
  else {headers=["Code","Name","OnHand","Consigned","AvgCost","LastPurchase","Selling"];rows=S.products.map(p=>{const st=stock(p.id);return [p.code,p.name,st.onHand,st.consigned,p.averageCost,p.lastPurchasePrice,p.sellingPrice];});}
  const csv=[headers.join(","),...rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))].join("\n");
  download(csv,"lihcc-"+type+".csv","text/csv");
}

function restoreFile(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{try{const p=JSON.parse(e.target.result); if(!confirm("Replace ALL data in this browser?"))return; S=p.data||p; save(); toast("Restored"); go("dashboard");}catch(err){toast("Invalid file","err");}};
  r.readAsText(f);
}
function download(text,name,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();}
function importCsv(type,text){
  const lines=text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return toast("Empty CSV","err");
  const headers=lines[0].split(",").map(h=>h.trim().toLowerCase().replace(/\s+/g,"_").replace(/"/g,""));
  let ok=0, errors=[];
  lines.slice(1).forEach((line,i)=>{
    const cols=line.split(",").map(c=>c.replace(/^"|"$/g,"").trim());
    const row={}; headers.forEach((h,ix)=>row[h]=cols[ix]||"");
    try{
      if(type==="products"){S.products.push({id:uid("PR"),code:row.code||nextNo("product","ITM"),name:row.name||row.product_name,generic:row.generic||"",brand:row.brand||"",catalogue:row.catalogue||"",purchasePrice:+row.purchase_price||+row.cost||0,sellingPrice:+row.selling_price||+row.price||0,minStock:+row.min_stock||0,averageCost:+row.opening_cost||0,lastPurchasePrice:+row.purchase_price||0,active:true,unit:"Piece",tax:0}); ok++;}
      else if(type==="vendors"){S.vendors.push({id:uid("VE"),code:row.code||nextNo("vendor","VEN"),name:row.name||row.vendor_name,company:row.company||"",phone:row.phone||"",opening:+row.opening_balance||0,active:true}); ok++;}
      else if(type==="customers"){S.customers.push({id:uid("CU"),code:row.code||nextNo("customer","CUS"),name:row.name||row.customer_name,org:row.organization||"",phone:row.phone||"",opening:+row.opening_balance||0,active:true,lihcc:false}); ok++;}
      else errors.push("Row "+(i+2)+": unknown type");
    }catch(e){errors.push("Row "+(i+2)+": "+e.message);}
  });
  save(); toast("Imported "+ok+" rows"+(errors.length?" ("+errors.length+" errors)":""));
}

function readFileAsData(input,cb){const f=input.files[0]; if(!f)return; if(f.size>1500000){toast("Keep under 1.5MB","err");return;} const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f);}

/* ========== UI ========== */
function rangeFilter(period){
  const now=new Date(); const start=new Date(now); start.setHours(0,0,0,0);
  if(period==="today") return {from:start.toISOString(),to:now.toISOString()};
  if(period==="week"){const d=new Date(start); d.setDate(d.getDate()-7); return {from:d.toISOString(),to:now.toISOString()};}
  if(period==="month") return {from:new Date(now.getFullYear(),now.getMonth(),1).toISOString(),to:now.toISOString()};
  if(period==="year") return {from:new Date(now.getFullYear(),0,1).toISOString(),to:now.toISOString()};
  return null;
}
function inRange(date,r){if(!r)return true; const t=new Date(date).getTime(); return t>=new Date(r.from).getTime() && t<=new Date(r.to).getTime();}

function stats(period){
  const r=rangeFilter(period);
  const sales=S.sales.filter(s=>s.status==="POSTED"&&inRange(s.date,r));
  const purch=S.purchases.filter(p=>p.status==="POSTED"&&inRange(p.date,r));
  const exp=S.expenses.filter(e=>e.status==="POSTED"&&inRange(e.date,r));
  const totalSales=round2(sales.reduce((s,x)=>s+x.total,0));
  const totalCost=round2(sales.reduce((s,x)=>s+x.totalCost,0));
  const gp=round2(sales.reduce((s,x)=>s+x.profit,0));
  const te=round2(exp.reduce((s,x)=>s+x.amount,0));
  return {
    totalSales,totalPurchases:round2(purch.reduce((s,x)=>s+x.total,0)),totalCost,gp,te,np:round2(gp-te),
    ar:round2(S.customers.reduce((s,c)=>s+Math.max(0,custOut(c.id)),0)),
    ap:round2(S.vendors.reduce((s,v)=>s+Math.max(0,vendOut(v.id)),0)),
    inv:round2(S.products.reduce((s,p)=>s+stock(p.id).value,0)),
    consQty:round2(S.consignments.reduce((s,c)=>s+c.items.reduce((a,i)=>a+Math.max(0,i.qtySupplied-i.qtyUsed-i.qtyReturned),0),0)),
    cash:accBal(AC.CASH), bank:accBal(AC.BANK),
    pending:S.sales.filter(s=>s.status==="POSTED"&&s.payStatus!=="PAID").slice(0,8),
    low:S.products.map(p=>({p,...stock(p.id)})).filter(x=>x.onHand<=x.p.minStock),
    recent:S.audit.slice(0,10),
    sales, purch
  };
}

function addItemRow(mode){
  const box=$("items"); const i=document.createElement("div"); i.className="item-row";
  const opts=`<option value="">Select item…</option>`+S.products.filter(p=>p.active!==false).map(p=>`<option value="${p.id}" data-buy="${p.purchasePrice}" data-sell="${p.sellingPrice}" data-tax="${p.tax||0}">${esc(p.code)} — ${esc(p.name)}</option>`).join("");
  i.innerHTML=`<div class="grid" style="grid-template-columns:2fr 90px 120px 90px 80px 36px;gap:6px">
    <select class="input" data-k="productId" onchange="onProd(this,'${mode}')">${opts}</select>
    <input class="input" data-k="qty" type="number" value="1" min="0" step="0.01" oninput="calcTot()">
    <input class="input" data-k="price" type="number" step="0.01" placeholder="Price" oninput="calcTot()">
    ${mode==="consignment"?`<input class="input" data-k="batch" placeholder="Batch"><span></span>`:`<input class="input" data-k="disc" type="number" value="0" placeholder="Disc" oninput="calcTot()"><input class="input" data-k="tax" type="number" value="0" placeholder="Tax%" oninput="calcTot()">`}
    <button class="btn btn-x" onclick="this.closest('.item-row').remove();calcTot()">✕</button>
  </div>${mode==="purchase"?`<div class="grid g2" style="margin-top:6px"><input class="input" data-k="batch" placeholder="Batch / lot"><input class="input" data-k="expiry" type="date"></div>`:mode==="consignment"?"":`<input class="input" data-k="batch" placeholder="Batch (optional)" style="margin-top:6px">`}`;
  box.appendChild(i); calcTot();
}
function onProd(sel,mode){
  const o=sel.selectedOptions[0]; if(!o||!o.value)return;
  const row=sel.closest(".item-row");
  row.querySelector("[data-k=price]").value=mode==="purchase"?o.dataset.buy:o.dataset.sell;
  const t=row.querySelector("[data-k=tax]"); if(t) t.value=o.dataset.tax||0;
  calcTot();
}
function calcTot(){
  let sub=0,disc=0,tax=0;
  document.querySelectorAll(".item-row").forEach(r=>{
    const q=+r.querySelector("[data-k=qty]").value||0, p=+r.querySelector("[data-k=price]").value||0;
    const d=+(r.querySelector("[data-k=disc]")||{value:0}).value||0, t=+(r.querySelector("[data-k=tax]")||{value:0}).value||0;
    sub+=q*p; disc+=d; tax+=(q*p-d)*(t/100);
  });
  const el=$("totbox"); if(el) el.innerHTML=`<div class="muted">Subtotal ${money(sub)} · Discount ${money(disc)} · Tax ${money(tax)}</div><div style="font-size:20px;font-weight:800">Total ${money(sub-disc+tax)}</div>`;
}

function renderReports(){
  const type=window._rtype||"sales";

  let body="";
  if(type==="sales"||type==="profit") body=`<table><thead><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Revenue</th><th>Cost</th><th>Profit</th></tr></thead><tbody>${S.sales.filter(s=>s.status==="POSTED").map(s=>`<tr><td>${fmt(s.date)}</td><td>${esc(s.number)}</td><td>${esc((S.customers.find(c=>c.id===s.customerId)||{}).name)}</td><td>${money(s.total)}</td><td>${money(s.totalCost)}</td><td class="${s.profit>=0?"profit":"loss"}">${money(s.profit)}</td></tr>`).join("")}</tbody></table>`;
  if(type==="purchases") body=`<table><thead><tr><th>Date</th><th>Bill</th><th>Vendor</th><th>Total</th><th>Paid</th></tr></thead><tbody>${S.purchases.filter(p=>p.status==="POSTED").map(p=>`<tr><td>${fmt(p.date)}</td><td>${esc(p.number)}</td><td>${esc((S.vendors.find(v=>v.id===p.vendorId)||{}).name)}</td><td>${money(p.total)}</td><td>${money(p.paid)}</td></tr>`).join("")}</tbody></table>`;
  if(type==="inventory") body=`<table><thead><tr><th>Item</th><th>On hand</th><th>Avg cost</th><th>Value</th></tr></thead><tbody>${S.products.map(p=>{const st=stock(p.id);return `<tr><td>${esc(p.name)}</td><td>${st.onHand}</td><td>${money(p.averageCost)}</td><td>${money(st.value)}</td></tr>`;}).join("")}</tbody></table>`;
  const st=stats("all");
  if(type==="pl") body=`<div style="max-width:420px;padding:16px"><div class="row"><span>Sales revenue</span><b>${money(st.totalSales)}</b></div><div class="row"><span>Cost of goods sold</span><b>${money(-st.totalCost)}</b></div><div class="row"><span>Gross profit</span><b class="${st.gp>=0?"profit":"loss"}">${money(st.gp)}</b></div><div class="row"><span>Operating expenses</span><b>${money(-st.te)}</b></div><div class="row" style="font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:8px"><span>Net profit / loss</span><span class="${st.np>=0?"profit":"loss"}">${money(st.np)}</span></div></div>`;
  if(type==="ar") body=`<div style="padding:16px;font-size:20px;font-weight:800">Total receivables ${money(st.ar)}</div><table>${S.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${money(custOut(c.id))}</td></tr>`).join("")}</table>`;
  if(type==="ap") body=`<div style="padding:16px;font-size:20px;font-weight:800">Total payables ${money(st.ap)}</div><table>${S.vendors.map(v=>`<tr><td>${esc(v.name)}</td><td>${money(vendOut(v.id))}</td></tr>`).join("")}</table>`;
  return pageHead("Reports","Filter, preview, print or export CSV")+
    `<div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${tabs.map(([k,l])=>`<button class="btn ${type===k?"btn-p":"btn-x"}" onclick="window._rtype='${k}';render()">${l}</button>`).join("")}
      <button class="btn btn-p" onclick="exportCsv('${type==="profit"?"sales":type==="pl"?"sales":type}')">Export CSV</button>
      <button class="btn btn-x" onclick="window.print()">Print / PDF</button></div>
    <div class="card">${body}</div>`;
}

    <div class="card" style="padding:16px;margin-top:12px"><b>CSV import</b>
      <p class="muted" style="margin:8px 0">Headers: products (code,name,generic,category,brand,catalogue,purchase_price,selling_price,min_stock) · vendors/customers (code,name,phone,opening_balance)</p>
      <select class="input" id="imp-type" style="max-width:200px;display:inline-block"><option>products</option><option>vendors</option><option>customers</option></select>
      <input type="file" accept=".csv,text/csv" onchange="(function(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importCsv(document.getElementById('imp-type').value,r.result);r.readAsText(f);})(this)">
    </div>
    <div class="card" style="padding:16px;margin-top:12px"><b>Reset demo data</b>
      <p class="muted" style="margin:8px 0">Reloads the sample 2023–2025 LIHCC records (stents at Rs 40,000 / 45,000 / 52,000).</p>
      <button class="btn btn-d" onclick="if(confirm('Erase current browser data and reload demo?')){localStorage.removeItem(KEY);location.reload()}">Reset to demo</button>
    </div>`;
}

function renderSearch(){
  const t=(q||"").toLowerCase();
  if(t.length<2) return pageHead("Search","Type at least 2 characters in the top box and press Enter");
  const sales=S.sales.filter(s=>s.number.toLowerCase().includes(t)||(s.ref||"").toLowerCase().includes(t));
  const prods=S.products.filter(p=>(p.name+p.code+p.brand+p.catalogue).toLowerCase().includes(t));
  const cust=S.customers.filter(c=>(c.name+c.code+(c.org||"")).toLowerCase().includes(t));
  const vend=S.vendors.filter(v=>(v.name+v.code).toLowerCase().includes(t));
  const lots=S.lots.filter(l=>(l.batch||"").toLowerCase().includes(t));
  const block=(title,items)=>items.length?`<div class="card" style="margin-bottom:10px"><div style="padding:12px 16px;font-weight:800">${title}</div>${items.join("")}</div>`:"";
  return pageHead("Search","Results for “"+esc(q)+"”")+
    block("Invoices",sales.map(s=>`<div style="padding:10px 16px;border-top:1px solid #f1f5f9"><a href="#" onclick="go('sale','${s.id}');return false">${esc(s.number)}</a> · ${money(s.total)}</div>`))+
    block("Products",prods.map(p=>`<div style="padding:10px 16px;border-top:1px solid #f1f5f9"><a href="#" onclick="go('product','${p.id}');return false">${esc(p.code)} · ${esc(p.name)}</a></div>`))+
    block("Customers",cust.map(c=>`<div style="padding:10px 16px;border-top:1px solid #f1f5f9"><a href="#" onclick="go('customer','${c.id}');return false">${esc(c.name)}</a></div>`))+
    block("Vendors",vend.map(v=>`<div style="padding:10px 16px;border-top:1px solid #f1f5f9"><a href="#" onclick="go('vendor','${v.id}');return false">${esc(v.name)}</a></div>`))+
    block("Batch / serial",lots.map(l=>{const p=S.products.find(x=>x.id===l.productId);return `<div style="padding:10px 16px;border-top:1px solid #f1f5f9"><a href="#" onclick="go('product','${l.productId}');return false">${esc(p?p.name:"")} · ${esc(l.batch)}</a></div>`;}));
}

function publicInvoice(){
  const token=location.hash.replace("#invoice=","");
  const s=S.sales.find(x=>x.token===token);
  if(!s) return `<div class="box"><div class="card" style="padding:24px">Invoice not found.</div></div>`;
  s.viewed=true; save();
  return `<div style="max-width:900px;margin:24px auto;padding:12px"><div class="muted" style="text-align:center;margin-bottom:10px">Secure invoice from ${esc(S.company.name)} · ${s.payStatus==="PAID"?"Paid":"Payment pending"}</div>${invoiceHTML(s)}</div>`;
}

function screenHTML(){
  if(location.hash.startsWith("#invoice=")) return publicInvoice();
  switch(screen){
    case "dashboard": return renderDashboard();
    case "products": return renderProducts();
    case "product-new": pid=""; return productForm();
    case "product": return renderProduct();
    case "purchases": return renderPurchases();
    case "purchase-new": return txForm("purchase");
    case "purchase": return renderPurchase();
    case "sales": return renderSales();
    case "sale-new": return txForm("sale");
    case "sale": return renderSale();
    case "consignments": return renderConsignments();
    case "consignment-new": return txForm("consignment");
    case "consignment": return renderConsignment();
    case "customers": return renderCustomers();
    case "customer-new": pid=""; return partyForm("customer");
    case "customer": return renderCustomer();
    case "vendors": return renderVendors();
    case "vendor-new": pid=""; return partyForm("vendor");
    case "vendor": return renderVendor();
    case "payments": return renderPayments();
    case "payment-new": return renderPaymentNew();
    case "expenses": return renderExpenses();
    case "accounting": return renderAccounting();
    case "reports": return renderReports();
    case "users": return renderUsers();
    case "settings": return renderSettings();
    case "search": return renderSearch();
    default: return renderDashboard();
  }
}

function render(){
  if(location.hash.startsWith("#invoice=")){$("app").innerHTML=publicInvoice();return;}
  if(!session){$("app").innerHTML=renderLogin();return;}
  $("app").innerHTML=shell(screenHTML());
  if(screen==="purchase-new"||screen==="sale-new"||screen==="consignment-new") addItemRow(screen.replace("-new",""));
}

function boot(){
  if(!load()) seed();
  else if(!S.accounts||!S.accounts.length) seed();
  try{const ss=JSON.parse(localStorage.getItem(KEY+"_SESSION")||"null"); if(ss&&ss.username){const u=S.users.find(x=>x.username===ss.username); if(u) session=ss;}}catch(e){}
  try{
    const goTo=new URLSearchParams(location.search).get("go");
    if(goTo) screen=goTo;
  }catch(e){}
  registerPWA();
  render();
}
window.addEventListener("hashchange",render);
boot();
</script>
</body>
</html>
